[paths]
; ---------------- 普通配置 ----------------
; 普通配置表二进制输出目录，由 Luban 生成常规 tables_*.bytes。
table_data_out=../Client/Assets/Bundles/Configs/bytes/

; 普通配置 C# 代码输出目录。
code_out=../Client/Assets/Scripts/Hotfix/GameProto/Config/Generate

; ---------------- 多语言配置 ----------------
; 是否启用多语言导出。启用后才会导出多语言 bytes、编辑器 JSON、LocalizationKey.cs，并复制 LocalizationConst 代码。
l10n_enabled=true

; 多语言文本表 Excel 路径，普通 text 字段的真实文本来源。
l10n_text_xlsx=./Excels/Localization

; 多语言文本表输出目录，生成 tables_tblocalization_{Language}.bytes。
l10n_text_out=../Client/Assets/Bundles/Configs/bytes/

; 多语言文本表 Excel 文件名匹配规则（正则，匹配不含 .xlsx 的文件名），匹配到的表会合并导出。
l10n_text_file_pattern=^Localization(?!Const$).*$

; 多语言常量表 Excel 路径，用于导出常量 bytes、编辑器 JSON 和 LocalizationKey.cs。
l10n_const_xlsx=./Excels/Localization/LocalizationConst.xlsx

; 多语言常量表输出目录，生成 tables_tblocalizationconst_{Language}.bytes。
l10n_const_out=../Client/Assets/Bundles/Configs/bytes/

; Unity 编辑器辅助 JSON 输出目录，用于编辑器侧反查多语言常量。
l10n_editor_out=../Client/Assets/Editor/Config

; LocalizationKey.cs 输出路径。
l10n_key_code_out=../Client/Assets/Scripts/Hotfix/GameLogic/LocalizationKey.cs

; LocalizationKey.cs 注释使用的语言列。
l10n_key_comment_language=ChineseSimplified

; LocalizationKey.cs 生成前缀白名单，空数组表示全部导出，例如 [Log.,System.]。
l10n_const_out_rule=[]

; 需要导出的语言列表，名称必须匹配 Excel 中的语言列名。
l10n_languages=[ChineseSimplified,English,Japanese]
