[paths]
; 所有路径均相对于 Config 目录。普通表结构与输入仍由 luban.conf 定义。
table_data_out=../Client/Assets/Bundles/Configs/bytes/ordinary
code_out=../Client/Assets/Scripts/Hotfix/GameProto/Config/Generate

; 多语言规则段格式：[<表类型>.<匹配方式>.<规则名>]
; 表类型：constant=词库、可选 C# 常量访问器；ordinary=仅词库。
; 匹配方式：dir=当前层 .xlsx + 文件名前缀；file=精确工作簿路径。
; 规则名自行命名。file 优先；没有 file 消歧时，多个 dir 命中同一表会报错。
; 例如新增 LocalizationConst_Shop.xlsx，放在下方目录当前层就会自动识别，并共用 Game 输出。
; 如需单独输出，增加 [constant.file.shop]，用 path 精确指定该表及自己的 data_out/code_out。

[localization]
languages=ChineseSimplified,English,Japanese
default_locale=ChineseSimplified
; 唯一的生成清单：运行时读取语言列表和默认语言，编辑器读取词库相对路径用于预览。
; 当前项目的启动代码从 Resources/Localization/RuntimeOptions 加载。
runtime_options_out=../Client/Assets/Resources/Localization/RuntimeOptions.json
; 按 Key 首段排除常量访问器；数据和校验仍保留这些 Key。
exclude_constant_prefixes=

[constant.dir.main]
path=Excels/Localization
prefix=LocalizationConst
; data_out 必须包含 {locale} 且以 .bytes 结尾；相同目标合并词库。
data_out=../Client/Assets/Bundles/Configs/bytes/localization/Game_{locale}.bytes
; code_out 是 .cs 文件；相同目标合并访问器，类名取文件名。
code_out=../Client/Assets/Scripts/Hotfix/GameLogic/LocalizationKey.cs

[constant.file.update]
path=Excels/Localization/LocalizationConst_Update.xlsx
data_out=../Client/Assets/Resources/Localization/Update_{locale}.bytes
code_out=../Client/Assets/Scripts/Startup/UpdateLocalizationKey.cs

[ordinary.dir.main]
path=Excels/Localization
prefix=Localization_
data_out=../Client/Assets/Bundles/Configs/bytes/localization/Game_{locale}.bytes
